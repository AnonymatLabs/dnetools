[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "build"
]
build-backend = "setuptools.build_meta"


[project]
name = "dnetools"
version = "2.0.0"

description = "Professional Network Intelligence Toolkit for cybersecurity research and ethical hacking"

readme = "README.md"

requires-python = ">=3.8"

authors = [
    {name = "Mr Deh H4ck3r", email = "anonymatlabs@gmail.com"}
]

license = {file = "LICENSE"}

keywords = [
    "cybersecurity",
    "network",
    "osint",
    "security",
    "ethical-hacking",
    "termux",
    "linux"
]


classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: Apache Software License"
]


dependencies = [
    "rich>=13.7.0",
    "requests>=2.31.0",
    "dnspython>=2.5.0",
    "python-whois>=0.8.0",
    "phonenumbers>=8.13.0",
    "colorama>=0.4.6"
]


[project.urls]

Homepage = "https://anonymatlab.blogspot.com"

Repository = "https://github.com/AnonymatLabs/dnetools"

Issues = "https://github.com/AnonymatLabs/dnetools/issues"


[project.scripts]

dnetools = "dnetools:main"


[tool.setuptools]

py-modules = [
    "dnetools"
]


[tool.setuptools.packages.find]

where = ["."]
include = [
    "core*",
    "modules*",
    "providers*",
    "reports*"
]


[tool.setuptools.package-data]

assets = [
    "*"
]

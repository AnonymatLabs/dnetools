[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "build"
]
build-backend = "setuptools.build_meta"

[project]
name = "dnetools"
version = "2.0.3"

description = "Professional Network Intelligence Toolkit for cybersecurity research and ethical hacking"

readme = "README.md"

requires-python = ">=3.8"

license = "Apache-2.0"

authors = [
    { name = "Mr Deh H4ck3r", email = "anonymatlabs@gmail.com" }
]

keywords = [
    "cybersecurity",
    "network",
    "networking",
    "osint",
    "ethical-hacking",
    "security",
    "dns",
    "whois",
    "ip",
    "geolocation",
    "termux",
    "linux",
    "python",
    "cli"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "rich>=13.7.0",
    "requests>=2.31.0",
    "dnspython>=2.5.0",
    "python-whois>=0.8.0",
    "phonenumbers>=8.13.0",
    "colorama>=0.4.6"
]

[project.urls]
Homepage = "https://anonymatlab.blogspot.com"
Repository = "https://github.com/AnonymatLabs/dnetools"
Documentation = "https://github.com/AnonymatLabs/dnetools/wiki"
Issues = "https://github.com/AnonymatLabs/dnetools/issues"
Changelog = "https://github.com/AnonymatLabs/dnetools/releases"

[project.scripts]
dnetools = "dnetools:main"

[tool.setuptools]
py-modules = [
    "dnetools"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "modules*",
    "providers*",
    "reports*"
]
exclude = [
    "tests*",
    "docs*"
]

[tool.setuptools.package-data]
"*" = [
    "*.md",
    "*.txt",
    "*.json",
    "*.yaml",
    "*.yml",
    "*.ini",
    "*.cfg"
]
